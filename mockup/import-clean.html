<!DOCTYPE html>
<html lang="zh-CN" data-theme="frost">
<head>
<meta charset="utf-8">
<title>导入表结构 · 干净态改版原型</title>
<link rel="stylesheet" href="_theme.css">
<style>
  /* 输入框伸到栏底：左栏只有这一张卡，跟右栏一起等高（.col.stretch / .card.fill 在 _theme.css） */

  /* 空态占位：右栏只有一个元素，虚线框 + 居中，颜色全部走 dim——
     它存在的意义是「这栏没坏，只是还没轮到它」，一个字多的说明都不放 */
  .empty-hero{
    flex:1; min-height:320px; padding:30px;
    border:1px dashed color-mix(in srgb, var(--line) 85%, transparent);
    border-radius:var(--r);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:var(--dim); text-align:center;
  }
  .empty-hero .ico{ font-size:34px; opacity:.45 }
  .empty-hero .t{ font-weight:600; letter-spacing:.5px }
  .empty-hero .s{ font-size:12.5px; opacity:.75; max-width:400px; line-height:1.9 }

  .tline{ display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  .tline .tn{ font:600 13.5px/1.3 var(--mono) }
  .fkline{ display:flex; align-items:center; gap:9px; padding:5px 0; font:12.5px/1.5 var(--mono); flex-wrap:wrap }
  .fkline .arw{ color:var(--acc); font-size:14px }
  .flash{ animation:fl .9s ease-out }
  @keyframes fl{ from{ box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 45%, transparent) } to{ box-shadow:none } }

  /* 真页面「粘贴后弹确认框」（antd modal.confirm）的原型替身：
     遮罩 + 居中卡，颜色全走主题变量 */
  .mask{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--bg) 62%, transparent); backdrop-filter:blur(2px) }
  .dlg{ width:min(460px, 92vw); border:1px solid var(--line); border-radius:var(--r);
    background:var(--panel); box-shadow:var(--glow); padding:18px 20px }
  .dlg h3{ margin:0 0 10px; font-size:14.5px }
  .dlg p{ margin:0 0 16px; font-size:12.5px; line-height:1.9; color:var(--dim) }
  .dlg .acts{ display:flex; gap:8px; justify-content:flex-end }
</style>
</head>
<body>
<div class="hud" data-hud></div>

<div class="app">
  <aside class="rail" data-rail data-page="import"></aside>

  <main class="main">
    <div class="top">
      <div>
        <div class="title">📥 导入表结构 · 干净态改版</div>
        <div class="sub">进页面全空 → 粘贴出预览并询问是否导入 → 确认后结果保留在页面上</div>
      </div>
      <div class="spacer"></div>
      <span class="auto">初始干净态 · 数字粘贴后才出现</span>
      <div class="sep"></div>
      <div data-tp></div>
    </div>

    <div class="pane">
      <div class="pane-in">
        <div class="split even">

          <!-- 左：输入。进页面全空，只有占位文案 -->
          <div class="col stretch">
            <div class="card fill">
              <i class="corner tl"></i>
              <div class="chead">
                <span class="dot"></span><span class="h">建表语句</span>
                <span class="who">Oracle / MySQL / PG</span>
                <div class="spacer"></div>
                <span class="tag hi" id="diaTag" style="display:none"></span>
              </div>
              <div class="cbody tight">
                <textarea class="fld flush tall" id="ddl" spellcheck="false"
                  placeholder="在此粘贴建表语句（CREATE TABLE）…&#10;&#10;支持 Navicat / DataGrip / PL-SQL Developer 导出的格式，&#10;可一次粘贴多张表。粘贴后右侧立即出现解析预览。"></textarea>
              </div>
              <div class="acts">
                <span class="lbl">示例</span>
                <button class="mini" data-eg="oracle">Oracle（PL/SQL 导出）</button>
                <button class="mini" data-eg="mysql">MySQL</button>
                <button class="mini" id="btnClear" disabled>清空</button>
                <div class="spacer"></div>
                <!-- 字符数初始不出现：0 字符也是噪音 -->
                <span class="hint" id="chars"></span>
              </div>
            </div>
          </div>

          <!-- 右：三个状态共用这一栏
               empty    —— 只有空态占位，一张卡、一个数字都没有
               preview  —— 解析出内容：计数、表、外键才出现（导入只走粘贴确认框，无按钮）
               imported —— 导入完成：结果条 + 撤销在顶上，预览原样保留 -->
          <div class="col stretch" id="right">
            <div id="status"></div>

            <div id="emptyMode">
              <div class="empty-hero">
                <div class="ico">📋</div>
                <div class="t">等待建表语句</div>
                <div class="s">把 CREATE TABLE 粘到左边 —— 这里会实时出现<br>表、字段、主键、外键的解析预览，确认后再导入。</div>
              </div>
            </div>

            <div class="card" id="statCard" style="display:none">
              <i class="corner br"></i>
              <div class="chead"><span class="dot"></span><span class="h">解析结果</span>
                <div class="spacer"></div><span class="who" id="fixWho"></span></div>
              <div class="cbody stack">
                <div class="stats" id="stats"></div>
                <div id="notes" class="stack" style="gap:8px"></div>
              </div>
            </div>

            <div class="card" id="tblCard" style="display:none">
              <div class="chead"><span class="h">表</span><span class="who" id="tblWho"></span>
                <div class="spacer"></div><span class="auto">第一张已展开</span></div>
              <div class="cbody" id="tbls"></div>
            </div>

            <div class="card" id="fkCard" style="display:none">
              <div class="chead"><span class="h">外键</span>
                <div class="spacer"></div><span class="who">✅ 真约束 · ⚠️ 命名推断</span></div>
              <div class="cbody" id="fkList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="_shell.js"></script>
<script src="_data.js"></script>
<script>
const { esc, bindFolds } = UI
const $ = s => document.querySelector(s)
/* EXISTING 是「缓存里已有的表」，导入会让它长大 —— 再粘一遍，同样的表就从「新增」变「覆盖」，
   这是导入确实改了缓存的可见证据 */
let EXISTING = new Set(DATA.tables.map(t => t.name))

/* 两段示例跟真页面 DdlImport.tsx 的是同一对表（order + order_detail）：
   MySQL 段带 FOREIGN KEY 约束 → ✅ 真约束；Oracle 段（PL/SQL 导出形状）故意不建约束，
   order_detail.order_id 只能靠命名推断 → ⚠️。种子里已有 order，粘 MySQL 示例
   还能同时看到「覆盖 order / 新增 order_detail」两种标签 */
const EG = {
  mysql: `CREATE TABLE \`order\` (
  \`id\`          BIGINT        NOT NULL AUTO_INCREMENT COMMENT '主键',
  \`order_no\`    VARCHAR(32)   NOT NULL COMMENT '订单号',
  \`total\`       DECIMAL(12,2) NOT NULL DEFAULT 0.00 COMMENT '订单金额',
  \`status\`      TINYINT       NOT NULL DEFAULT 0 COMMENT '状态 0待付 1已付 2已发货 3完成',
  \`del_flag\`    TINYINT(1)    NOT NULL DEFAULT 0 COMMENT '是否删除 0否 1是',
  \`remark\`      VARCHAR(200)  DEFAULT NULL COMMENT '备注',
  \`create_time\` DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '下单时间',
  PRIMARY KEY (\`id\`),
  UNIQUE KEY \`uk_order_no\` (\`order_no\`)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='订单表';

CREATE TABLE \`order_detail\` (
  \`id\`          BIGINT        NOT NULL AUTO_INCREMENT COMMENT '主键',
  \`order_id\`    BIGINT        NOT NULL COMMENT '所属订单',
  \`sku\`         VARCHAR(40)   NOT NULL COMMENT '商品编码',
  \`qty\`         INT           NOT NULL DEFAULT 1 COMMENT '数量',
  \`price\`       DECIMAL(12,2) NOT NULL DEFAULT 0.00 COMMENT '单价',
  \`create_time\` DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
  PRIMARY KEY (\`id\`),
  CONSTRAINT \`fk_order_detail_order\` FOREIGN KEY (\`order_id\`) REFERENCES \`order\` (\`id\`)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='订单明细表';`,

  oracle: `create table "ORDER"
(
  id          NUMBER(19) not null,
  order_no    NVARCHAR2(32) not null,
  total       NUMBER(12,2) default 0 not null,
  status      NUMBER(1) default 0 not null,
  remark      LONG RAW,
  create_time TIMESTAMP(6) WITH TIME ZONE default systimestamp not null
)
tablespace USERS
  pctfree 10
  initrans 1
  maxtrans 255
  storage
  (
    initial 64K
    next 1M
  );
comment on table "ORDER" is '订单表';
comment on column "ORDER".id is '主键';
comment on column "ORDER".order_no is '订单号';
comment on column "ORDER".total is '订单金额';
comment on column "ORDER".status is '状态 0待付 1已付 2已发货 9作废';
comment on column "ORDER".remark is '备注（二进制）';
comment on column "ORDER".create_time is '下单时间';
alter table "ORDER" add constraint PK_ORDER primary key (ID);

create table ORDER_DETAIL
(
  id       NUMBER(19) not null,
  order_id NUMBER(19) not null,
  sku      VARCHAR2(40) not null,
  qty      NUMBER(10) default 1 not null,
  price    NUMBER(12,2) default 0 not null
)
tablespace USERS;
comment on table ORDER_DETAIL is '订单明细表';
comment on column ORDER_DETAIL.id is '主键';
comment on column ORDER_DETAIL.order_id is '所属订单';
comment on column ORDER_DETAIL.sku is '商品编码';
comment on column ORDER_DETAIL.qty is '数量';
comment on column ORDER_DETAIL.price is '单价';
alter table ORDER_DETAIL add constraint PK_ORDER_DETAIL primary key (ID);`,
}

/* ================= 解析 =================
   抄自 import.html（旧版原型）的简化解析器，规则照 lib/oracleDdl.ts + lib/ddlParser.ts。
   几条不能省的：
   - 一切扫描都得认引号。`default 'NUMBER'` 里的 NUMBER 是用户的数据，不是类型词。
   - 存储子句按白名单砍（tablespace/pctfree/...），不能「砍掉右括号后面的东西」——
     MySQL 的 ENGINE=InnoDB COMMENT='用户表' 也在右括号后面，一律砍就把表注释弄丢了。
   - 记下用户原样写的类型文本并显示它。显示成规整化后的 DECIMAL(25)，
     用户点一次「导出 DDL」拿去执行就把人家 Oracle 表的字段类型改了。
   ============================================================ */

/** 去掉注释，但字符串里的 -- 和 /* 不算注释 */
function stripComments(src) {
  let out = '', q = null
  for (let i = 0; i < src.length; i++) {
    const ch = src[i], nx = src[i + 1]
    if (q) { out += ch; if (ch === q) q = null; continue }
    if (ch === "'" || ch === '"' || ch === '`') { q = ch; out += ch; continue }
    if (ch === '-' && nx === '-') { while (i < src.length && src[i] !== '\n') i++; out += '\n'; continue }
    if (ch === '/' && nx === '*') { i += 2; while (i < src.length && !(src[i] === '*' && src[i + 1] === '/')) i++; i++; continue }
    out += ch
  }
  return out
}

/** 按分隔符切，只在括号深度 0 且不在引号里时切 */
function splitTop(src, sep) {
  const out = []; let cur = '', d = 0, q = null
  for (const ch of src) {
    if (q) { cur += ch; if (ch === q) q = null; continue }
    if (ch === "'" || ch === '"' || ch === '`') { q = ch; cur += ch; continue }
    if (ch === '(') d++
    else if (ch === ')') d--
    else if (ch === sep && d === 0) { out.push(cur); cur = ''; continue }
    cur += ch
  }
  if (cur.trim()) out.push(cur)
  return out
}

const unq = s => (s || '').replace(/^[`"\[]|[`"\]]$/g, '')
const uns = s => (s || '').replace(/^'|'$/g, '').replace(/''/g, "'")
const camel = s => s.toLowerCase().replace(/_([a-z0-9])/g, (m, x) => x.toUpperCase())

// 多词类型的尾词白名单：只截第一个词等于把 LONG RAW 记成 LONG
const TAIL = /^(?:raw|precision|varying|unsigned|zerofill|byte|with|without|time|zone|local|to|second|day|month|year|minute|hour|set|text)$/i
// 存储子句白名单，遇到就把后面全丢掉
const STORAGE = /\b(tablespace|pctfree|pctused|initrans|maxtrans|storage|logging|nologging|nocompress|cache|nocache|monitoring|parallel|noparallel|lob\s*\()\b/i

function javaType(type, dialectOracle) {
  const T = type.toUpperCase()
  const p = /\(\s*(\d+)\s*(?:,\s*(\d+)\s*)?\)/.exec(T)
  const prec = p ? +p[1] : null, scale = p && p[2] !== undefined ? +p[2] : 0
  if (/^(NUMBER|DECIMAL|NUMERIC)/.test(T)) {
    if (scale > 0) return 'BigDecimal'
    // NUMBER(1) 不猜 Boolean：取值 0/1/9 时猜成 Boolean 就表达不出 9。
    // NUMBER(25) 不给 Long：25 位超出 long 的 19 位，溢出不报错，数字直接变成别的数。
    if (prec === null) return 'BigDecimal'
    if (prec <= 9) return 'Integer'
    if (prec <= 18) return 'Long'
    return 'BigDecimal'
  }
  if (/^TINYINT\(1\)/.test(T)) return 'Boolean'   // MySQL 的社区惯例，Oracle 没有
  if (/^(BIGINT)/.test(T)) return 'Long'
  if (/^(INT|INTEGER|SMALLINT|TINYINT|MEDIUMINT)/.test(T)) return 'Integer'
  if (/^(FLOAT|DOUBLE|REAL|BINARY_DOUBLE)/.test(T)) return 'Double'
  if (/^(BOOLEAN|BOOL|BIT)/.test(T)) return 'Boolean'
  if (/^(DATETIME|TIMESTAMP)/.test(T)) return 'LocalDateTime'
  // Oracle 的 DATE 带时分秒，MySQL 的 DATE 不带。拿这一条去猜错就是把日期字段悄悄搞错
  if (/^DATE/.test(T)) return dialectOracle ? 'LocalDateTime' : 'LocalDate'
  if (/^TIME/.test(T)) return 'LocalTime'
  if (/(BLOB|RAW|BYTEA|BINARY)/.test(T)) return 'byte[]'
  return 'String'
}

function parseColumn(part, oracle) {
  const m = /^\s*[`"\[]?([A-Za-z_][\w$#]*)[`"\]]?\s+([\s\S]+)$/.exec(part)
  if (!m) return null
  const name = unq(m[1]).toLowerCase()
  let rest = m[2].trim()
  const tm = /^([A-Za-z_][\w$#]*)\s*(\([^)]*\))?/.exec(rest)
  if (!tm) return null
  let type = tm[1].toUpperCase() + (tm[2] ? tm[2].replace(/\s+/g, '') : '')
  rest = rest.slice(tm[0].length).trim()
  for (;;) {
    const w = /^([A-Za-z_]+)\s*(\([^)]*\))?/.exec(rest)
    if (!w || !TAIL.test(w[1])) break
    type += ' ' + w[1].toUpperCase() + (w[2] ? w[2].replace(/\s+/g, '') : '')
    rest = rest.slice(w[0].length).trim()
  }
  const dm = /\bdefault\s+((?:'(?:[^']|'')*')|[\w$.:+-]+(?:\s*\([^)]*\))?)/i.exec(rest)
  const cm = /\bcomment\s+('(?:[^']|'')*')/i.exec(rest)
  const def = dm ? dm[1].trim() : ''
  return {
    n: name, t: type, j: javaType(type, oracle),
    nn: /\bnot\s+null\b/i.test(rest) ? 1 : 0,
    pk: /\bprimary\s+key\b/i.test(rest) ? 1 : 0,
    ai: /\b(auto_increment|generated\s+(?:always|by\s+default)\s+as\s+identity)\b/i.test(rest) ? 1 : 0,
    d: /^null$/i.test(def) ? '' : def,
    c: cm ? uns(cm[1]) : '',
  }
}

function parse(src) {
  const oracle = /\b(varchar2|number\s*\(|comment\s+on\s+(table|column)|tablespace|nvarchar2|systimestamp)\b/i.test(src)
  const stmts = splitTop(stripComments(src), ';').map(s => s.trim()).filter(Boolean)
  const tables = [], fks = [], fails = [], fixes = new Set()
  const byName = new Map()

  for (const st of stmts) {
    const ct = /^create\s+(?:global\s+temporary\s+)?table\s+(?:if\s+not\s+exists\s+)?([`"\[]?[\w$#.]+[`"\]]?)\s*\(([\s\S]*)$/i.exec(st)
    if (ct) {
      const name = unq(ct[1]).split('.').pop().toLowerCase()
      // 取到跟开括号配对的那个右括号，后面的是尾巴（MySQL 的 ENGINE=/COMMENT= 或 Oracle 的存储子句）
      let d = 1, i = 0, body = '', q = null
      const raw = ct[2]
      for (; i < raw.length; i++) {
        const ch = raw[i]
        if (q) { body += ch; if (ch === q) q = null; continue }
        if (ch === "'" || ch === '"' || ch === '`') { q = ch; body += ch; continue }
        if (ch === '(') d++
        if (ch === ')') { d--; if (!d) break }
        body += ch
      }
      const tail = raw.slice(i + 1)
      const tc = /\bcomment\s*=?\s*('(?:[^']|'')*')/i.exec(tail)
      if (STORAGE.test(tail)) fixes.add('砍掉 Oracle 存储子句（tablespace / pctfree / storage）')

      const cols = [], pk = []
      for (const part0 of splitTop(body, ',')) {
        const part = part0.trim()
        if (!part) continue
        const pkm = /^primary\s+key\s*\(([^)]*)\)/i.exec(part)
        if (pkm) { pkm[1].split(',').forEach(x => pk.push(unq(x.trim()).toLowerCase())); continue }
        const fkm = /^(?:constraint\s+([`"\[]?[\w$#]+[`"\]]?)\s+)?foreign\s+key\s*\(([^)]*)\)\s*references\s+([`"\[]?[\w$#.]+[`"\]]?)\s*\(([^)]*)\)/i.exec(part)
        if (fkm) {
          fks.push({ name: unq(fkm[1] || '').toLowerCase(), from: name, fromCol: unq(fkm[2].trim()).toLowerCase(),
            to: unq(fkm[3]).split('.').pop().toLowerCase(), toCol: unq(fkm[4].trim()).toLowerCase(), conf: 'constraint' })
          continue
        }
        if (/^(unique|key|index|check|constraint|fulltext|spatial)\b/i.test(part)) continue
        const c = parseColumn(part, oracle)
        if (c) { cols.push(c); if (c.pk) pk.push(c.n) } else fails.push(part.slice(0, 60))
      }
      if (!cols.length) { fails.push(`${name}：一个字段都没解析出来`); continue }
      cols.forEach(c => { c.pk = pk.includes(c.n) ? 1 : 0 })
      if (oracle) fixes.add('Oracle 类型词换成可解析的写法，界面显示的仍是你原样写的类型')
      const t = { name, comment: tc ? uns(tc[1]) : '', javaClass: name.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(''), columns: cols }
      tables.push(t); byName.set(name, t)
      continue
    }

    // Oracle：注释是独立语句
    let m = /^comment\s+on\s+table\s+([`"\[]?[\w$#.]+[`"\]]?)\s+is\s+('(?:[^']|'')*')/i.exec(st)
    if (m) {
      const t = byName.get(unq(m[1]).split('.').pop().toLowerCase())
      if (t) { t.comment = uns(m[2]); fixes.add('把独立的 comment on 语句并回字段注释') }
      continue
    }
    m = /^comment\s+on\s+column\s+([`"\[]?[\w$#]+[`"\]]?)\.([`"\[]?[\w$#]+[`"\]]?)\s+is\s+('(?:[^']|'')*')/i.exec(st)
    if (m) {
      const t = byName.get(unq(m[1]).toLowerCase())
      const c = t?.columns.find(x => x.n === unq(m[2]).toLowerCase())
      if (c) { c.c = uns(m[3]); fixes.add('把独立的 comment on 语句并回字段注释') }
      continue
    }
    // Oracle：主键 / 外键在独立的 alter table 里
    m = /^alter\s+table\s+([`"\[]?[\w$#.]+[`"\]]?)\s+add\s+(?:constraint\s+([`"\[]?[\w$#]+[`"\]]?)\s+)?primary\s+key\s*\(([^)]*)\)/i.exec(st)
    if (m) {
      const t = byName.get(unq(m[1]).split('.').pop().toLowerCase())
      if (t) {
        const names = m[3].split(',').map(x => unq(x.trim()).toLowerCase())
        t.columns.forEach(c => { if (names.includes(c.n)) c.pk = 1 })
        fixes.add('把独立 alter table 里的主键并回表定义')
      }
      continue
    }
    m = /^alter\s+table\s+([`"\[]?[\w$#.]+[`"\]]?)\s+add\s+(?:constraint\s+([`"\[]?[\w$#]+[`"\]]?)\s+)?foreign\s+key\s*\(([^)]*)\)\s*references\s+([`"\[]?[\w$#.]+[`"\]]?)\s*\(([^)]*)\)/i.exec(st)
    if (m) {
      fks.push({ name: unq(m[2] || '').toLowerCase(), from: unq(m[1]).split('.').pop().toLowerCase(),
        fromCol: unq(m[3].trim()).toLowerCase(), to: unq(m[4]).split('.').pop().toLowerCase(),
        toCol: unq(m[5].trim()).toLowerCase(), conf: 'constraint' })
      fixes.add('把独立 alter table 里的外键并回表定义')
      continue
    }
    if (/^(create|alter|drop|insert|set|use|grant|prompt)\b/i.test(st)) continue
    fails.push(st.slice(0, 60))
  }

  /* 命名推断：xxx_id 且 xxx 是已知表。这类关系默认不勾，
     推断可能是错的，默认参与 JOIN 等于悄悄生成错 SQL。 */
  const known = new Map([...byName].map(([k, v]) => [k, v]))
  DATA.tables.forEach(t => { if (!known.has(t.name)) known.set(t.name, t) })
  const hasFk = new Set(fks.map(f => f.from + '.' + f.fromCol))
  for (const t of tables) {
    for (const c of t.columns) {
      const mm = /^(\w+)_id$/.exec(c.n)
      if (!mm || hasFk.has(t.name + '.' + c.n)) continue
      const target = known.get(mm[1]) || known.get(mm[1] + 's')
      if (!target || target.name === t.name) continue
      const tpk = target.columns.find(x => x.pk)
      if (!tpk) continue
      fks.push({ name: '', from: t.name, fromCol: c.n, to: target.name, toCol: tpk.n, conf: 'naming' })
    }
  }

  return { oracle, tables, fks, fails, fixes: [...fixes] }
}

/* ================= 渲染 =================
   三个状态只有 render() 说的算：
   - empty    输入为空 → 只画空态占位。数字区、表卡、外键卡连 display 都不给，
              「一个 0」也是内容，粘贴前这栏没有发生过任何事
   - preview  有输入 → 实时解析，计数/表/外键全部出现（导入按钮没有——导入只走粘贴确认框）
   - imported 点了导入 → 输入框不清空、预览不收起，结果条 + 撤销出现在顶上，
              表标签统一换成「已导入」（importedView 冻结这一帧）。
              「导完即走」在真页面是跳速查页，原型跳不了页——把结果收掉，
              用户看到的只会是「页面没反应/结果丢了」 */
let importedView = null
function render() {
  const src = $('#ddl').value
  $('#chars').textContent = src ? `${src.length} 字符 · ${src.split('\n').length} 行` : ''
  $('#btnClear').disabled = !src.trim()

  if (!src.trim()) {
    $('#diaTag').style.display = 'none'
    $('#emptyMode').style.display = ''
    ;['#statCard', '#tblCard', '#fkCard'].forEach(s => { $(s).style.display = 'none' })
    $('#status').innerHTML = ''
    importedView = null
    return
  }

  // 导入后原样保留：文本没变就继续画冻结的那一帧；一改文本就自然退出导入态
  const frozen = importedView && importedView.src === src ? importedView : null
  if (!frozen) importedView = null

  const r = frozen ? frozen.r : parse(src)
  $('#emptyMode').style.display = 'none'
  // 三张结果卡初始 HTML 里就是 display:none，空态分支又只会继续藏 ——
  // 进了「有输入」的分支必须先把它们放出来，否则只有顶部状态带可见，
  // 表卡/字段/统计永远出不来（重写 render 时从 import.html 丢掉的一行，真踩过）
  ;['#statCard', '#tblCard'].forEach(s => { $(s).style.display = '' })
  $('#diaTag').style.display = ''
  $('#diaTag').textContent = (r.oracle ? 'Oracle' : 'MySQL / PG') + ' · 自动识别'

  const nCols = r.tables.reduce((a, t) => a + t.columns.length, 0)
  const nCon = r.fks.filter(f => f.conf === 'constraint').length
  const nNam = r.fks.length - nCon
  const covered = r.tables.filter(t => EXISTING.has(t.name))

  if (!r.tables.length) {
    $('#status').innerHTML = `<div class="band err"><b>没解析出任何 CREATE TABLE</b> —— 检查一下是不是只粘到了一半。
      ${r.fails.length ? '看不懂的片段：<span class="mono">' + esc(r.fails[0]) + '</span>' : ''}</div>`
  } else if (frozen) {
    // 已导入态：结果条在顶上，下面的统计/表/外键照常渲染，标签统一「已导入」
    $('#status').innerHTML = `<div class="band ok flash" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b>✓ 已导入 ${r.tables.length} 张表 · ${nCols} 个字段 · ${nCon} 条外键</b>
      <span class="tag ok">新增 ${frozen.addedNames.length}</span>
      ${frozen.coveredNames.length ? `<span class="tag wr">覆盖 ${frozen.coveredNames.length}：${esc(frozen.coveredNames.join('、'))}</span>` : ''}
      <div class="spacer" style="flex:1"></div>
      <button class="mini" id="undo">↶ 撤销这次导入</button></div>
      <div class="band">预览保留在下面，标签已换成「已导入」—— 点左下「清空」回干净空态。</div>`
    $('#undo').onclick = () => {
      // 原型只能回滚「新增」的表名；被覆盖的表没存旧定义，回不去 —— 真页面同理不提供撤销
      frozen.addedNames.forEach(n => EXISTING.delete(n))
      importedView = null
      render()
    }
  } else {
    // 预览态没有导入按钮（评审定稿：导入只走粘贴确认框，不设第二个手动入口）——
    // 「先看看」的人看完想导，重新粘贴一次就会再弹确认
    $('#status').innerHTML = `<div class="band ok" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b>✓ 解析出 ${r.tables.length} 张表 · ${nCols} 个字段 · ${nCon} 条外键</b>
      ${covered.length ? `<span class="tag wr">覆盖 ${covered.map(t => t.name).join('、')}</span>` : ''}
      <div class="spacer" style="flex:1"></div>
      <span class="hint">点「先看看」跳过的：重新粘贴一次会再弹导入确认。</span></div>`
  }

  $('#stats').innerHTML = [
    ['表', r.tables.length, 'acc'], ['字段', nCols, ''],
    ['外键约束', nCon, 'ok'], ['命名推断', nNam, nNam ? 'warn' : ''],
  ].map(([t, v, k]) => `<div class="stat ${k}"><div class="t">${t}</div><div class="v">${v}</div></div>`).join('')

  $('#fixWho').textContent = r.fixes.length ? `自动修了 ${r.fixes.length} 处` : ''
  const notes = []
  r.fixes.forEach(f => notes.push(`<div class="band info">${esc(f)}</div>`))
  if (nNam) notes.push(`<div class="band warn"><b>${nNam} 条关系是从 <span class="mono">xxx_id</span> 命名推断的</b>，
    不是真外键 —— 生成 JOIN 时默认不勾，导出 DDL 时也不会输出。</div>`)
  if (r.fails.length) notes.push(`<div class="band err">有 ${r.fails.length} 段没看懂，已跳过：
    <span class="mono">${esc(r.fails.slice(0, 2).join(' / '))}</span></div>`)
  $('#notes').innerHTML = notes.join('')

  $('#tblWho').textContent = `${r.tables.length} 张`
  $('#tbls').innerHTML = r.tables.map((t, i) => `
    <div class="fold ${i === 0 ? 'on' : ''}">
      <div class="fold-h">
        <span class="caret">▶</span>
        <div class="tline">
          <span class="tn">${esc(t.name)}</span>
          <span class="hint">${esc(t.comment || '（没有表注释）')}</span>
        </div>
        <div class="spacer" style="flex:1"></div>
        <span class="tag">${t.columns.length} 字段</span>
        <span class="tag">${esc(t.javaClass)}.java</span>
        ${frozen ? '<span class="tag ok">已导入</span>'
                 : `<span class="tag ${EXISTING.has(t.name) ? 'wr' : 'ok'}">${EXISTING.has(t.name) ? '覆盖' : '新增'}</span>`}
      </div>
      <div class="fold-b" style="padding:0">
        <div class="scroll"><table class="tbl">
          <thead><tr><th style="width:150px">字段</th><th style="width:180px">你写的类型</th>
            <th style="width:76px">主键</th><th style="width:66px">必填</th>
            <th style="width:140px">默认值</th><th>注释</th><th style="width:200px">Java 映射</th></tr></thead>
          <tbody>${t.columns.map(c => `<tr>
            <td class="mono">${esc(c.n)}</td>
            <td class="mono muted">${esc(c.t)}</td>
            <td>${c.pk ? `<span class="tag pk">PK${c.ai ? ' 自增' : ''}</span>` : ''}</td>
            <td>${c.nn ? '<span class="tag">NOT NULL</span>' : '<span class="muted">—</span>'}</td>
            <td class="mono muted">${c.d ? esc(c.d) : '—'}</td>
            <td>${c.c ? esc(c.c) : '<span class="muted">—</span>'}</td>
            <td class="mono muted">${esc(c.j)} ${esc(camel(c.n))}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>`).join('')
  bindFolds($('#tbls'))

  $('#fkCard').style.display = r.fks.length ? '' : 'none'
  $('#fkList').innerHTML = r.fks.map(f => `<div class="fkline">
      <span>${esc(f.from)}.${esc(f.fromCol)}</span><span class="arw">→</span>
      <span>${esc(f.to)}.${esc(f.toCol)}</span>
      ${f.conf === 'constraint' ? `<span class="tag ok">✅ 外键约束${f.name ? ' ' + esc(f.name) : ''}</span>`
      : '<span class="tag wr">⚠️ 命名推断 · 默认不参与 JOIN</span>'}
    </div>`).join('')
}

/** 导入：并入 EXISTING、记下冻结展示。预览不收起、输入不清空——
    收掉结果在原型里只会像「页面没反应」，清空交给用户点「清空」 */
function doImport(r, src) {
  // 新增/覆盖必须赶在并入 EXISTING 之前算，并入后人人都是「已有」
  const coveredNames = r.tables.filter(t => EXISTING.has(t.name)).map(t => t.name)
  const addedNames = r.tables.filter(t => !EXISTING.has(t.name)).map(t => t.name)
  r.tables.forEach(t => EXISTING.add(t.name))
  importedView = { src, r, addedNames, coveredNames }
  render()
}

/* 真页面（优化6）：粘贴后立刻弹「是否导入」——入库会按表名覆盖且不可撤销，
   这道确认是故意留的；点「导入」就自动入库，没有第二个手动入口。
   「先看看」关掉弹窗留在此页预览，想导就重新粘贴一次再确认。
   原型里这个手写弹窗就是 antd modal.confirm 的替身 */
function askImport(r, src) {
  if (document.querySelector('.mask')) return   // 弹窗开着就不叠
  const mask = document.createElement('div')
  mask.className = 'mask'
  mask.innerHTML = `<div class="dlg">
    <h3>检测到粘贴了建表语句，是否导入 ${r.tables.length} 张表？</h3>
    <p>导入会按表名覆盖已有的同名表、字段整体替换（不合并）。<br>点「先看看」留在此页看预览；想导就重新粘贴一次。</p>
    <div class="acts">
      <button class="mini" data-no>先看看</button>
      <button class="mini" data-yes style="color:var(--acc-ink);background:linear-gradient(180deg,var(--acc),var(--acc2));border:0;font-weight:700">导入</button>
    </div>
  </div>`
  const close = () => mask.remove()
  mask.querySelector('[data-yes]').onclick = () => { close(); doImport(r, src) }
  mask.querySelector('[data-no]').onclick = close
  mask.onclick = e => { if (e.target === mask) close() }   // 点遮罩 = 先看看
  document.body.appendChild(mask)
}

/* 真实的 onPaste 里 textarea.value 还是旧的，得从 clipboardData 读 —— 这条只有真浏览器验得出来。
   原型里两条路都留着：paste 用 clipboardData 抢先算一次，普通输入走 input 防抖。 */
$('#ddl').addEventListener('paste', e => {
  const txt = e.clipboardData?.getData('text')
  if (!txt) return
  e.preventDefault()
  const el = $('#ddl'), s = el.selectionStart, t = el.selectionEnd
  el.value = el.value.slice(0, s) + txt + el.value.slice(t)
  el.selectionStart = el.selectionEnd = s + txt.length
  render()
  // 只在真粘贴时弹确认框，打字 / 点示例不弹 —— 和真页面的 pasteNonce 语义一致
  const r = parse(el.value)
  if (r.tables.length) askImport(r, el.value)
})
let timer
$('#ddl').oninput = () => { clearTimeout(timer); timer = setTimeout(() => render(), 140) }
document.querySelectorAll('[data-eg]').forEach(b => {
  b.onclick = () => { $('#ddl').value = EG[b.dataset.eg] || ''; render() }
})
$('#btnClear').onclick = () => { $('#ddl').value = ''; render() }

// 进页面是干净的空态，不预填任何示例 —— 这就是要评审的东西本身
render()
</script>
</body>
</html>
